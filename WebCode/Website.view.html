<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Team Candy Movie Project</title>
    <link rel="stylesheet" href="MainStyles.css">
</head>
<body>

<div class="header">
    <header class="f-header" id="moving-header">
        Movie.
    </header>
</div>

<div class="MovieContainer" id="movie-list"></div>

<footer>
    <div>
        <a href="MovieLoginPage.html" class="Button">
            Login Page
        </a>
    </div>
    <div class="footer-bottom">
        <p>&copy; 2026 (Movie Website). All rights reserved.</p>
    </div>
</footer>

<script>
    fetch("http://localhost:8080/movies")
        .then(response => response.json())
        .then(movies => {
            const container = document.getElementById("movie-list");

            movies.forEach(movie => {
                const section = document.createElement("section");
                section.style.padding = "40px";
                section.style.textAlign = "center";

                // ⭐ FIXED: Always load images from the server
                section.innerHTML = `
                    <img src="http://localhost:8080${movie.poster}"
                         alt="${movie.title}"
                         class="movie-poster"
                         data-movie="${movie.title}"
                         style="width: 250px; border-radius: 12px; cursor: pointer;">
                    <h2>${movie.title}</h2>
                `;

                container.appendChild(section);
            });

            document.querySelectorAll('.movie-poster').forEach(poster => {
                poster.addEventListener('click', () => {
                    const movieName = poster.getAttribute('data-movie');
                    window.location.href = `Movie-info.html?movie=${encodeURIComponent(movieName)}`;
                });
            });
        })
        .catch(err => console.error("Failed to load movies:", err));
</script>

</body>
</html>
