<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Movie Information</title>
    <link rel="stylesheet" href="MainStyles.css">
</head>
<body>

<div class="header">
    <header class="f-header" id="moving-header">
        Movie.
    </header>
</div>

<div id="movieContent" style="padding: 20px;"></div>

<script>
    const params = new URLSearchParams(window.location.search);
    const movieName = params.get("movie");

    fetch("http://localhost:8080/movies")
        .then(res => res.json())
        .then(movies => {
            const movie = movies.find(m => m.title === movieName);
            const content = document.getElementById("movieContent");

            if (movie) {
                content.innerHTML = `
                    <h1>${movie.title}</h1>

                    <!-- ⭐ FIXED: Always load images from the server -->
                    <img src="http://localhost:8080${movie.poster}"
                         style="width:250px; border-radius:12px;">

                    <p><strong>Duration:</strong> ${movie.duration} minutes</p>
                    <p><strong>Description:</strong> ${movie.description}</p>
                    <p><strong>Theater:</strong> ${movie.theater}</p>
                `;
            } else {
                content.innerHTML = "<h2>This Movie is no longer Available.</h2>";
            }
        })
        .catch(err => console.error("Error loading movie info:", err));
</script>

<div style="margin-bottom: 20px;">
    <a href="Website.view.html"
       style="padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 6px;">
        ⬅ Back to Main Website
    </a>
</div>

</body>
</html>
