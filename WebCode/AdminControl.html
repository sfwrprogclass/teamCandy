<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Page</title>
</head>
<body>

<h1>Admin Control Panel</h1>

<form id="movieForm">

    <label for="title">Movie Title</label><br>
    <input id="title" placeholder="Movie Title" required><br><br>

    <label for="duration">Duration (minutes)</label><br>
    <input id="duration" type="number" placeholder="Duration" required><br><br>

    <label for="description">Description</label><br>
    <input id="description" placeholder="Description" required><br><br>

    <label for="theater">Theater</label><br>
    <input id="theater" placeholder="Theater" required><br><br>

    <label for="poster">Movie Poster</label><br>
    <input id="poster" type="file" accept="image/*"><br><br>

    <img id="preview" style="width:150px; display:none; border-radius:8px;"><br><br>

    <button type="submit">Add Movie</button>

    <br>
    <br>

</form>

<script>
    document.getElementById("poster").addEventListener("change", function() {
    const file = this.files[0];
    if (file) {
        const preview = document.getElementById("preview");
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
        preview.onload = () => URL.revokeObjectURL(preview.src);
    }
});

document.getElementById("movieForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const file = document.getElementById("poster").files[0];
    const reader = new FileReader();

    reader.onload = async () => {
        const base64 = reader.result.split(",")[1];

        const movieData = {
            title: document.getElementById("title").value,
            duration: document.getElementById("duration").value,
            description: document.getElementById("description").value,
            theater: document.getElementById("theater").value,
            posterBase64: base64,
            posterName: file.name
        };

        await fetch("http://localhost:8080/addMovie", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(movieData)
        });

        alert("Movie added!");
    };

    reader.readAsDataURL(file);
});
</script>

<div style="margin-bottom: 20px;">
    <a href="Website.view.html"
       style="padding: 10px 20px; background: #333; color: white; text-decoration: none; border-radius: 6px;">
        ⬅ Back to Main Website
    </a>
</div>

</body>
</html>
