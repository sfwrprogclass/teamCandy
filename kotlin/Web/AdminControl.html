<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Control Page</title>
    <link rel="stylesheet" href="MainStyles.css">
</head>
<body>
<div>
    <header class="header">
        Admin Control Panel
    </header>
</div>

<div class="page-container">

    <!-- ADD MOVIE -->
    <div class="dropdown">🎬 Add Movie</div>
    <div class="dropdown-content">
        <form id="addMovieForm">

            <label>Movie Name</label><br>
            <input id="addName" required><br><br>

            <label>Duration (minutes)</label><br>
            <input id="addDuration" type="number" required><br><br>

            <label>Rating</label><br>
            <input id="addRating" required><br><br>

            <label>Description</label><br>
            <textarea id="addDescription" required></textarea><br><br>

            <label>Image URL</label><br>
            <input id="addImageUrl" required><br><br>

            <!-- IMAGE PREVIEW -->
            <img id="addPreview" style="width:150px; margin-top:10px; display:none; border-radius:8px;">

            <br><br>
            <button type="submit">Add Movie</button>
        </form>
    </div>

    <!-- MOVIE LIST -->
    <div class="dropdown">📚 View Movie List</div>
    <div class="dropdown-content">
        <button onclick="loadMovies()">Refresh List</button>
        <div id="movieList"></div>
    </div>

    <!-- EDIT MOVIE -->
    <div class="dropdown">🛠️ Edit Movie</div>
    <div class="dropdown-content">
        <form id="editMovieForm">

            <label>Movie ID</label><br>
            <input id="editId" type="number" required><br><br>

            <label>New Name</label><br>
            <input id="editName"><br><br>

            <label>New Duration</label><br>
            <input id="editDuration" type="number"><br><br>

            <label>New Rating</label><br>
            <input id="editRating"><br><br>

            <label>New Description</label><br>
            <textarea id="editDescription"></textarea><br><br>

            <label>New Image URL</label><br>
            <input id="editImageUrl"><br><br>

            <!-- IMAGE PREVIEW -->
            <img id="editPreview" style="width:150px; margin-top:10px; display:none; border-radius:8px;">

            <br><br>
            <button type="submit">Update Movie</button>
        </form>
    </div>

    <!-- DELETE MOVIE -->
    <div class="dropdown">❌ Delete Movie</div>
    <div class="dropdown-content">
        <form id="deleteMovieForm">
            <label>Movie ID</label><br>
            <input id="deleteId" type="number" required><br><br>

            <button type="submit" class="delete-btn">Delete Movie</button>
        </form>
    </div>

</div>
<br>

<script>
    // LIVE IMAGE PREVIEW (ADD MOVIE)
    document.getElementById("addImageUrl").addEventListener("input", () => {
        const url = addImageUrl.value;
        const preview = document.getElementById("addPreview");

        if (url.trim() === "") {
            preview.style.display = "none";
            return;
        }

        preview.src = url;
        preview.style.display = "block";
    });

    // LIVE IMAGE PREVIEW (EDIT MOVIE)
    document.getElementById("editImageUrl").addEventListener("input", () => {
        const url = editImageUrl.value;
        const preview = document.getElementById("editPreview");

        if (url.trim() === "") {
            preview.style.display = "none";
            return;
        }

        preview.src = url;
        preview.style.display = "block";
    });

    // ADD MOVIE
    document.getElementById("addMovieForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const movie = {
            name: addName.value,
            durationMinutes: parseInt(addDuration.value),
            rating: addRating.value,
            description: addDescription.value,
            imageUrl: addImageUrl.value
        };

        await fetch("http://localhost:8080/api/movies", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(movie)
        });

        alert("Movie added!");
        loadMovies();
    });

    // LOAD MOVIES
    async function loadMovies() {
        const res = await fetch("http://localhost:8080/api/movies");
        const movies = await res.json();

        const list = document.getElementById("movieList");
        list.innerHTML = "";

        movies.forEach(m => {
            list.innerHTML += `
                <div class="movie-card">
                    <img src="${m.imageUrl}" style="width:150px; border-radius:8px;"><br>
                    <strong>ID:</strong> ${m.id}<br>
                    <strong>Name:</strong> ${m.name}<br>
                    <strong>Duration:</strong> ${m.durationMinutes} minutes<br>
                    <strong>Rating:</strong> ${m.rating}<br>
                    <strong>Description:</strong> ${m.description}<br>
                </div>
            `;
        });
    }

    // EDIT MOVIE
    document.getElementById("editMovieForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = editId.value;

        const movie = {
            name: editName.value || undefined,
            durationMinutes: editDuration.value ? parseInt(editDuration.value) : undefined,
            rating: editRating.value || undefined,
            description: editDescription.value || undefined,
            imageUrl: editImageUrl.value || undefined
        };

        await fetch(`http://localhost:8080/api/movies/${id}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(movie)
        });

        loadMovies();
    });

    // DELETE MOVIE
    document.getElementById("deleteMovieForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const id = deleteId.value;

        await fetch(`http://localhost:8080/api/movies/${id}`, {
            method: "DELETE"
        });

        loadMovies();
    });
</script>

<!-- FOOTER -->
<footer>
    <a href="Website.view.html" class="back-btn">
        ⬅ Back to Main Website
    </a>

    <button id="darkModeToggle" onclick="toggleDarkMode()">Dark Mode</button>

    <div class="footer-bottom">
        <p>&copy; 2026 (Movie Website). All rights reserved.</p>
    </div>
</footer>

<script src="Java.js"></script>
</body>
</html>
